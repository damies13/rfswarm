[project]
name = "rfswarm-test-env"
version = "0.1.0"
description = "Test environment for rfswarm"
requires-python = ">=3.9,<3.14"

dependencies = [
    "robotframework (>=7.3.2,<8.0.0)",
]

[dependency-groups]
agent = [
    "robotframework-databaselibrary (>=2.1.4,<3.0.0)",
    "robotframework-httpctrl (>=0.3.1,<0.4.0)",
]
manager = [
    "pyscreeze (==0.1.28)",
    "numpy (<2) ; python_version < '3.11'",
    "pymupdf (>=1.23.1)",
    "pyautogui (!=0.9.54)",
    "clipboard (>=0.0.4,<0.0.5)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "opencv-python",

    "robotframework-imagehorizonlibrary (>=1.0,<2.0)",
    "robotframework-databaselibrary (>=2.3.3,<3.0.0)",
    "robotframework-ocrlibrary (>=2.0.0,<3.0.0)",
    "robotframework-requests (>=0.9.7,<0.10.0)"
]
reporter = [
    "pydantic (>=2.12.4,<3.0.0)",
    "opencv-python",
    "pillow (>=11.3.0,<12.0.0)",
    "pyscreeze (==0.1.28)",
    "pyautogui (!=0.9.54)",
    "clipboard (>=0.0.4,<0.0.5)",
    "python-docx (>=1.2.0,<2.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "openpyxl-image-loader (>=1.0.5,<2.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "psutil (>=7.1.3,<8.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",

    "robotframework-imagehorizonlibrary (>=1.0,<2.0)",
    "robotframework-databaselibrary (>=2.3.3,<3.0.0)",
    "robotframework-ocrlibrary (>=2.0.0,<3.0.0)",
    "robotframework-doctestlibrary (>=0.29.1,<0.30.0)",
    "robotframework-archivelibrary (>=0.4.3,<0.5.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.agent]
optional = true
[tool.poetry.group.manager]
optional = true
[tool.poetry.group.reporter]
optional = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
