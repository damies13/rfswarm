---
name: Regression Tests - Manager

on: workflow_call

jobs:
  Manager:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
        # robot: ['6.1.1', '7.0']
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        tag: ['GUI', 'CommandLine', 'Languages']
      fail-fast: false
    runs-on: ${{ matrix.platform }}
    steps:
      - name: "Echo Vars"
        run: |
          echo matrix.platform: ${{ matrix.platform }}
          echo matrix.python: ${{ matrix.python }}
      - name: (MacOS, <3.11) Fix Python's tkinter Issue-649 (https://github.com/actions/setup-python/issues/649)
        shell: bash
        if: ${{ startswith(matrix.platform, 'macos-') && contains('3.7;3.8;3.9;3.10', matrix.python) }}
        run: |
          brew install tcl-tk pyenv openssl readline sqlite3 xz zlib
          env \
            PATH="$(brew --prefix tcl-tk)/bin:$PATH" \
            LDFLAGS="-L$(brew --prefix tcl-tk)/lib" \
            CPPFLAGS="-I$(brew --prefix tcl-tk)/include" \
            PKG_CONFIG_PATH="$(brew --prefix tcl-tk)/lib/pkgconfig" \
            CFLAGS="-I$(brew --prefix tcl-tk)/include" \
            PYTHON_CONFIGURE_OPTS="--with-tcltk-includes='-I$(brew --prefix tcl-tk)/include' --with-tcltk-libs='-L$(brew --prefix tcl-tk)/lib -ltcl8.6 -ltk8.6'" \
            pyenv install ${{matrix.python}}
          pyenv global ${{matrix.python}}
      - name: setup-python
        if: ${{ !startswith(matrix.platform, 'macos-') || contains('3.11;3.12;', matrix.python) }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Pip Update
        run: python -m pip install --upgrade pip
      - name: Checkout
        uses: actions/checkout@v4
      - name: "Apt Update"
        if: ${{ matrix.platform == 'ubuntu-latest' }}
        run: |
          sudo apt update -y
      - name: "Ubuntu Installs"
        if: ${{ matrix.platform == 'ubuntu-latest' }}
          # sudo apt install -y python3-tk python3-dev python3-xlib scrot fluxbox
        run: |
          sudo apt -y install python3-tk python3-dev python3-xlib scrot lxqt xclip ntpdate
          sudo apt list --installed
      - name: "Ubuntu Xvfb"
        if: ${{ matrix.platform == 'ubuntu-latest' }}
        run: |
          export DISPLAY=:13.0
          Xvfb :13 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          # xauth with complain unless ~/.Xauthority exists
          touch ~/.Xauthority
          # To view a listing of the .Xauthority file, enter the following
          xauth list
          sleep 1
          # fluxbox
          # fluxbox &
          # lxqt
          startlxqt &

      - name: "MacOS Set Display Resolution"
        if: ${{ matrix.platform == 'macos-latest' }}
        continue-on-error: true
        run: |
          brew install screenresolution
          screenresolution list
          # screenresolution set 1920x1080x32@60
          screenresolution set 1280x960x32@60

      - name: "Windows Set Display Resolution"
        if: ${{ matrix.platform == 'windows-latest' }}
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Update Robot Tag
        shell: python
        run: |
          import os
          tag = "${{ matrix.platform }}"
          tagarr = tag.split("-")
          tag = "{}-latest".format(tagarr[0])

          env_file = os.getenv('GITHUB_ENV')
          with open(env_file, "a") as myfile:
            myfile.write("tag={}\n".format(tag))

      - name: Install poetry
        run: python -m pip install poetry
      - name: Install Manager Tests requirements
        run: poetry install --with manager_test

      - name: Download packages to dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Show Dist
        shell: bash
        run: |
          ls -la dist
      - name: Install Manager from dist
        shell: bash
        run: poetry run pip install dist/rfswarm_manager-*.whl
      - name: Install Agent from dist (for testing Issues)
        shell: bash
        run: poetry run pip install dist/rfswarm_agent-*.whl

      # The cv2 directory gets overwritten when the installation of the wand packages takes place in the windows environment
      - name: Reinstall opencv
        if: ${{ matrix.platform == 'windows-latest' }}
        run: |
          poetry run pip uninstall -y opencv-python
          poetry run pip install --force-reinstall opencv-python-headless

      - name: Robot Framework
        id: robottest
        continue-on-error: true
        run: >
          poetry run robot
          --include ${{ env.tag }}
          --exclude NOT${{ matrix.tag }}
          --outputdir Tests/Regression/Manager/Logs/${{ matrix.platform }}_${{ matrix.python }}_${{ matrix.tag }}/run
          Tests/Regression/Manager
        env:
          DISPLAY: :13.0
          MATRIX_PLATFORM: ${{ matrix.platform }}
          MATRIX_PYTHON: ${{ matrix.python }}

      - name: Try and fix images with relative path (ubuntu)
        if: ${{ !cancelled() && matrix.platform == 'ubuntu-latest' }}
        continue-on-error: true
        run: |
          cd Tests/Regression/Manager/Logs/${{ matrix.platform }}_${{ matrix.python }}_${{ matrix.tag }}/run
          sed --in-place=.bak 's/img src=".*${{ matrix.platform }}_${{ matrix.python }}_${{ matrix.tag }}\/run/img src="./g' ./output.xml
          poetry run rebot ./output.xml
      - name: Try and fix images with relative path (macos)
        if: ${{ !cancelled() && matrix.platform == 'macos-latest' }}
        continue-on-error: true
        run: |
          cd Tests/Regression/Manager/Logs/${{ matrix.platform }}_${{ matrix.python }}_${{ matrix.tag }}/run
          sed -i.bak 's/img src=".*${{ matrix.platform }}_${{ matrix.python }}_${{ matrix.tag }}\/run/img src="./g' ./output.xml
          poetry run rebot ./output.xml
      - name: Try and fix images with relative path (windows)
        if: ${{ !cancelled() && matrix.platform == 'windows-latest' }}
        continue-on-error: true
        run: |
          cd Tests/Regression/Manager/Logs/${{ matrix.platform }}_${{ matrix.python }}_${{ matrix.tag }}/run
          sed --in-place=.bak 's/img src=".*${{ matrix.platform }}_${{ matrix.python }}_${{ matrix.tag }}\run/img src="./g' ./output.xml
          poetry run rebot ./output.xml

      - name: Robot Framework - Retry Failed
        if: steps.robottest.outcome != 'success'
        id: robotretry
        continue-on-error: true
        run: >
          poetry run robot
          --include ${{ env.tag }}
          --exclude NOT${{ matrix.tag }}
          --rerunfailed Tests/Regression/Manager/Logs/${{ matrix.platform }}_${{ matrix.python }}_${{ matrix.tag }}/run/output.xml
          --outputdir Tests/Regression/Manager/Logs/${{ matrix.platform }}_${{ matrix.python }}_${{ matrix.tag }}/retry
          Tests/Regression/Manager
        env:
          DISPLAY: :13.0
          MATRIX_PLATFORM: ${{ matrix.platform }}
          MATRIX_PYTHON: ${{ matrix.python }}

      - name: Try and fix images with relative path (ubuntu)
        if: ${{ steps.robottest.outcome != 'success' && !cancelled() && matrix.platform == 'ubuntu-latest' }}
        continue-on-error: true
        run: |
          cd Tests/Regression/Manager/Logs/${{ matrix.platform }}_${{ matrix.python }}_${{ matrix.tag }}/retry
          sed --in-place=.bak 's/img src=".*${{ matrix.platform }}_${{ matrix.python }}_${{ matrix.tag }}\/retry/img src="./g' ./output.xml
          poetry run rebot ./output.xml
      - name: Try and fix images with relative path (macos)
        if: ${{ steps.robottest.outcome != 'success' && !cancelled() && matrix.platform == 'macos-latest' }}
        continue-on-error: true
        run: |
          cd Tests/Regression/Manager/Logs/${{ matrix.platform }}_${{ matrix.python }}_${{ matrix.tag }}/retry
          sed -i.bak 's/img src=".*${{ matrix.platform }}_${{ matrix.python }}_${{ matrix.tag }}\/retry/img src="./g' ./output.xml
          poetry run rebot ./output.xml
      - name: Try and fix images with relative path (windows)
        if: ${{ steps.robottest.outcome != 'success' && !cancelled() && matrix.platform == 'windows-latest' }}
        continue-on-error: true
        run: |
          cd Tests/Regression/Manager/Logs/${{ matrix.platform }}_${{ matrix.python }}_${{ matrix.tag }}/retry
          sed --in-place=.bak 's/img src=".*${{ matrix.platform }}_${{ matrix.python }}_${{ matrix.tag }}\retry/img src="./g' ./output.xml
          poetry run rebot ./output.xml


      - name: if retry still failed
        if: steps.robottest.outcome != 'success' && steps.robotretry.outcome != 'success'
        run: exit 1



      - name: Archive Manager Logs
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: Manager-${{ matrix.platform }}-${{ matrix.python }}-${{ matrix.tag }}
          path: Tests/Regression/Manager/Logs/${{ matrix.platform }}_${{ matrix.python }}_${{ matrix.tag }}
          retention-days: 15

      - name: Archive Manager Logs (longer retention if failed)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: Manager-${{ matrix.platform }}-${{ matrix.python }}-${{ matrix.tag }}
          path: Tests/Regression/Manager/Logs/${{ matrix.platform }}_${{ matrix.python }}_${{ matrix.tag }}
          retention-days: 90
