---
name: Regression Tests - Agent

on: workflow_call

jobs:
  Agent:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
      fail-fast: false
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Pip Update
        run: python -m pip install --upgrade pip

      - name: Update Robot Tag
        shell: python
        run: |
          import os
          tag = "${{ matrix.platform }}"
          tagarr = tag.split("-")
          tag = "{}-latest".format(tagarr[0])

          env_file = os.getenv('GITHUB_ENV')
          with open(env_file, "a") as myfile:
            myfile.write("tag={}\n".format(tag))

      - name: Install poetry
        run: python -m pip install poetry
      - name: Install Agent Tests requirements
        run: poetry install --with agent_test

      - name: Download packages to dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Show Dist
        shell: bash
        run: |
          ls -la dist
      - name: Install Agent from dist
        shell: bash
        run: poetry run pip install dist/rfswarm_agent-*.whl
      - name: Install Manager from dist (for testing Issues)
        shell: bash
        run: poetry run pip install dist/rfswarm_manager-*.whl

      - name: Robot Framework
        id: robottest
        continue-on-error: true
        run: >
          poetry run robot
          --include ${{ env.tag }}
          --outputdir Tests/Regression/Agent/Logs/${{ matrix.platform }}_${{ matrix.python }}/run
          Tests/Regression/Agent

      - name: Robot Framework - Retry Failed
        if: steps.robottest.outcome != 'success'
        id: robotretry
        continue-on-error: true
        run: >
          poetry run robot
          --include ${{ env.tag }}
          --rerunfailed Tests/Regression/Agent/Logs/${{ matrix.platform }}_${{ matrix.python }}/run/output.xml
          --outputdir Tests/Regression/Agent/Logs/${{ matrix.platform }}_${{ matrix.python }}/retry
          Tests/Regression/Agent

      - name: if retry still failed
        if: steps.robottest.outcome != 'success' && steps.robotretry.outcome != 'success'
        run: exit 1

      - name: Archive Agent Logs
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: Agent-${{ matrix.platform }}-${{ matrix.python }}
          path: Tests/Regression/Agent/Logs/${{ matrix.platform }}_${{ matrix.python }}
          retention-days: 15

      - name: Archive Agent Logs (longer retention if failed)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: Agent-${{ matrix.platform }}-${{ matrix.python }}
          path: Tests/Regression/Agent/Logs/${{ matrix.platform }}_${{ matrix.python }}
          retention-days: 90
