---
name: Regression Tests - Agent

on: workflow_call

jobs:
  Reporter:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
      fail-fast: false
    runs-on: ${{ matrix.platform }}
    steps:
      - name: "Echo Vars"
        run: |
          echo matrix.platform: ${{ matrix.platform }}
          echo matrix.python: ${{ matrix.python }}
      - name: setup-python (macOS Tcl/Tk 9)
        shell: bash
        if: ${{ startswith(matrix.platform, 'macos-') && contains('3.7;3.8;3.9;3.10;3.11;3.12;3.13', matrix.python) }}
        run: |
          brew install tcl-tk pyenv openssl readline sqlite3 xz zlib
          TCLTK_PREFIX="$(brew --prefix tcl-tk)"
          # Resolve partial version (e.g. '3.10') to latest available patch
          # release; pyenv requires a full version string like '3.10.20'
          MATRIX_PYTHON="${{ matrix.python }}"
          FULL_VERSION=$(pyenv install --list | grep -E "^\s+${MATRIX_PYTHON//./\\.}\.[0-9]+$" | tail -1 | tr -d ' ')
          if [[ -z "$FULL_VERSION" ]]; then
            echo "ERROR: could not resolve pyenv version for $MATRIX_PYTHON"
            exit 1
          fi
          echo "Resolved $MATRIX_PYTHON -> $FULL_VERSION"
          # Use explicit Tcl/Tk 9 library names; -f forces rebuild over any
          # runner-image pre-installed Python that may have linked to Tk 8.6
          export LDFLAGS="-L$TCLTK_PREFIX/lib"
          export CPPFLAGS="-I$TCLTK_PREFIX/include/tcl-tk"
          export PKG_CONFIG_PATH="$TCLTK_PREFIX/lib/pkgconfig"
          export PATH="$TCLTK_PREFIX/bin:$PATH"
          export PYTHON_CONFIGURE_OPTS="--with-tcltk-includes=-I$TCLTK_PREFIX/include/tcl-tk --with-tcltk-libs='-L$TCLTK_PREFIX/lib -ltcl9.0 -ltcl9tk9.0'"
          pyenv install -f $FULL_VERSION
          pyenv global $FULL_VERSION
          echo "$HOME/.pyenv/shims" >> $GITHUB_PATH
          echo "$HOME/.pyenv/bin" >> $GITHUB_PATH
          python -c "import platform, tkinter as tk; print(platform.python_version()); print(f'Tcl/Tk {tk.TclVersion}/{tk.TkVersion}')"
      - name: setup-python
        if: ${{ !startswith(matrix.platform, 'macos-') }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Pip Update
        run: python -m pip install --upgrade pip
      - name: Checkout
        uses: actions/checkout@v4
      - name: "Apt Update"
        if: ${{ matrix.platform == 'ubuntu-latest' }}
        run: |
          sudo apt update -y
      - name: "Ubuntu Installs"
        if: ${{ matrix.platform == 'ubuntu-latest' }}
        # Install the minimal LXQt desktop.
        # sudo apt install lxqt
        # Install the Xfce desktop.
        # sudo apt install xfce4
          # sudo apt -y install python3-tk python3-dev python3-xlib scrot fluxbox tesseract-ocr
        run: |
          sudo apt -y install python3-tk python3-dev python3-xlib scrot lxqt tesseract-ocr
          sudo apt -y install xsel xclip
          sudo apt list --installed
      - name: "Ubuntu Xvfb"
        if: ${{ matrix.platform == 'ubuntu-latest' }}
        run: |
          export DISPLAY=:13.0
          Xvfb :13 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          # xauth with complain unless ~/.Xauthority exists
          touch ~/.Xauthority
          # To view a listing of the .Xauthority file, enter the following
          xauth list
          sleep 1
          # fluxbox
          # fluxbox &
          # lxqt
          startlxqt &

      - name: "MacOS Set Display Resolution"
        if: ${{ matrix.platform == 'macos-latest' }}
        continue-on-error: true
        run: |
          brew install screenresolution
          screenresolution list
          # screenresolution set 1920x1080x32@60
          screenresolution set 1280x960x32@60

        # https://github.com/actions/runner-images/issues/2935
      - name: "Windows Set Display Resolution"
        if: ${{ matrix.platform == 'windows-latest' }}
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: "MacOS Install tesseract"
        if: ${{ matrix.platform == 'macos-latest' }}
        run: |
          brew install tesseract
      - name: "Windows Download Tesseract"
        if: ${{ matrix.platform == 'windows-latest' }}
        shell: pwsh
        # old url "https://digi.bib.uni-mannheim.de/tesseract/tesseract-ocr-w64-setup-5.3.1.20230401.exe" - now gets 403 forbiddin
        # new url "https://github.com/tesseract-ocr/tesseract/releases/download/5.5.0/tesseract-ocr-w64-setup-5.5.0.20241111.exe"
        run: >
          Invoke-WebRequest
          -Uri "https://github.com/tesseract-ocr/tesseract/releases/download/5.5.0/tesseract-ocr-w64-setup-5.5.0.20241111.exe"
          -OutFile "$($ENV:Temp)\tesseract-ocr-w64-setup-5.5.0.20241111.exe"
      - name: "Windows Install Tesseract"
        if: ${{ matrix.platform == 'windows-latest' }}
        shell: cmd
        run: |
          "%Temp%\tesseract-ocr-w64-setup-5.5.0.20241111.exe" /S
      - name: "Windows Add Tesseract to Path"
        if: ${{ matrix.platform == 'windows-latest' }}
        shell: pwsh
        run: |
          echo "$($ENV:ProgramFiles)\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: "Verify tesseract"
        run: tesseract -v

      - name: Update Robot Tag
        shell: python
        run: |
          import os
          tag = "${{ matrix.platform }}"
          tagarr = tag.split("-")
          tag = "{}-latest".format(tagarr[0])
          platform = "{}".format(tagarr[0])

          env_file = os.getenv('GITHUB_ENV')
          with open(env_file, "a") as myfile:
            myfile.write("tag={}\n".format(tag))
            myfile.write("platformos={}\n".format(platform))

      - name: Install poetry
        run: python -m pip install poetry
      - name: Install Reporter Tests requirements
        run: poetry install --with reporter_test

      - name: Download packages to dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Show Dist
        shell: bash
        run: |
          ls -la dist
      - name: Install Reporter from dist
        shell: bash
        run: poetry run pip install dist/rfswarm_reporter-*.whl

      # The cv2 directory gets overwritten when the installation of the wand packages takes place in the windows environment
      - name: Reinstall opencv
        if: ${{ matrix.platform == 'windows-latest' }}
        run: |
          poetry run pip uninstall -y opencv-python
          poetry run pip install --force-reinstall opencv-python-headless

      # --listener Tests/Resources/GHListener.py
      # --exitonfailure
      - name: Robot Framework
        id: robottest
        continue-on-error: true
        run: >
          poetry run robot
          --include ${{ env.tag }}
          --outputdir Tests/Regression/Reporter/Logs/${{ matrix.platform }}_${{ matrix.python }}/run
          --listener Tests/Resources/GHListener.py
          Tests/Regression/Reporter
        env:
          DISPLAY: :13.0

      - name: Try and fix images with relative path (ubuntu)
        if: ${{ !cancelled() && matrix.platform == 'ubuntu-latest' }}
        continue-on-error: true
        run: |
          cd Tests/Regression/Reporter/Logs/${{ matrix.platform }}_${{ matrix.python }}/run
          sed --in-place=.bak 's/img src=".*${{ matrix.platform }}_${{ matrix.python }}\/run/img src="./g' ./output.xml
          poetry run rebot ./output.xml
      - name: Try and fix images with relative path (windows)
        if: ${{ !cancelled() && matrix.platform == 'windows-latest' }}
        continue-on-error: true
        run: |
          cd Tests/Regression/Reporter/Logs/${{ matrix.platform }}_${{ matrix.python }}//run
          sed --in-place=.bak 's/img src=".*${{ matrix.platform }}_${{ matrix.python }}\\run/img src="./g' ./output.xml
          poetry run rebot ./output.xml
      - name: Try and fix images with relative path
        if: ${{ !cancelled() && matrix.platform != 'macos-latest' }}
        continue-on-error: true
        run: |
          cd Tests/Regression/Reporter/Logs/${{ matrix.platform }}_${{ matrix.python }}/run
          sed --in-place=.bak 's/img src=".*${{ matrix.platform }}_${{ matrix.python }}\/run/img src="./g' ./output.xml
          poetry run rebot ./output.xml
      - name: Try and fix images with relative path (macos)
        if: ${{ !cancelled() &&  matrix.platform == 'macos-latest' }}
        continue-on-error: true
        run: |
          cd Tests/Regression/Reporter/Logs/${{ matrix.platform }}_${{ matrix.python }}/run
          sed -i.bak 's/img src=".*${{ matrix.platform }}_${{ matrix.python }}\/run/img src="./g' ./output.xml
          poetry run rebot ./output.xml

      # perhapes we have an issue with pboard failing, lets try Force quit the Pboard server
      #   https://iboysoft.com/tips/copy-and-paste-not-working-mac.html
      - name: "Force quit the Pboard server"
        if: ${{ matrix.platform == 'macos-latest' }}
        run: |
          killall pboard

      # --exitonfailure
      - name: Robot Framework - Retry Failed
        if: steps.robottest.outcome != 'success'
        id: robotretry
        continue-on-error: true
        run: >
          poetry run robot
          --include ${{ env.tag }}
          --listener Tests/Resources/GHListener.py
          --rerunfailed Tests/Regression/Reporter/Logs/${{ matrix.platform }}_${{ matrix.python }}/run/output.xml
          --outputdir Tests/Regression/Reporter/Logs/${{ matrix.platform }}_${{ matrix.python }}/retry
          Tests/Regression/Reporter
        env:
          DISPLAY: :13.0

      - name: Try and fix images with relative path (ubuntu)
        if: ${{ steps.robottest.outcome != 'success' && !cancelled() && matrix.platform == 'ubuntu-latest' }}
        continue-on-error: true
        run: |
          cd Tests/Regression/Reporter/Logs/${{ matrix.platform }}_${{ matrix.python }}/retry
          sed --in-place=.bak 's/img src=".*${{ matrix.platform }}_${{ matrix.python }}\/retry/img src="./g' ./output.xml
          poetry run rebot ./output.xml
      - name: Try and fix images with relative path (windows)
        if: ${{ steps.robottest.outcome != 'success' && !cancelled() && matrix.platform == 'windows-latest' }}
        continue-on-error: true
        run: |
          cd Tests/Regression/Reporter/Logs/${{ matrix.platform }}_${{ matrix.python }}/retry
          sed --in-place=.bak 's/img src=".*${{ matrix.platform }}_${{ matrix.python }}\\retry/img src="./g' ./output.xml
          poetry run rebot ./output.xml
      - name: Try and fix images with relative path (macos)
        if: ${{ steps.robottest.outcome != 'success' && !cancelled() &&  matrix.platform == 'macos-latest' }}
        continue-on-error: true
        run: |
          cd Tests/Regression/Reporter/Logs/${{ matrix.platform }}_${{ matrix.python }}/retry
          sed -i.bak 's/img src=".*${{ matrix.platform }}_${{ matrix.python }}\/retry/img src="./g' ./output.xml
          poetry run rebot ./output.xml

      - name: if retry still failed
        if: steps.robottest.outcome != 'success' && steps.robotretry.outcome != 'success'
        run: exit 1

      - name: Archive Reporter Logs
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: Reporter-${{ matrix.platform }}-${{ matrix.python }}
          path: Tests/Regression/Reporter/Logs/${{ matrix.platform }}_${{ matrix.python }}
          retention-days: 15

      - name: Archive Reporter Logs (longer retention if failed)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: Reporter-${{ matrix.platform }}-${{ matrix.python }}
          path: Tests/Regression/Reporter/Logs/${{ matrix.platform }}_${{ matrix.python }}
          retention-days: 90