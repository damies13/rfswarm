---
name: Super-Linter

on:
  push:
    paths-ignore:
      - '**.png'
      - '**.jpg'
  pull_request:
    types: [opened, reopened]

jobs:
  super-lint:
    name: Lint code base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # 2026-02-15 22:59:18 [INFO]   Check that you set the 'fetch-depth: 0' option for the actions/checkout step in your GitHub Actions workflow.
          # 2026-02-15 22:59:18 [INFO]   See https://github.com/super-linter/super-linter#get-started
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0
          persist-credentials: false

      - name: Get Branch Name
        run: |
          branchname=$(git rev-parse --abbrev-ref HEAD)
          echo "branchname=$branchname" >> "$GITHUB_ENV"
          
      - name: Run Super-Linter
        uses: super-linter/super-linter@v8.3.1
        env:
          DEFAULT_BRANCH: ${{ env.branchname }}
          FILTER_REGEX_EXCLUDE: (.*github\/workspace.*|.*sh|.git.*|.*Doc\/Images.*|.*Tests.*Logs.*|.*Tests.*testdata.*|.*Tests\/Demo.*)
          VALIDATE_PYTHON_BLACK: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_CSS: false
          VALIDATE_HTML: false
          VALIDATE_JSCPD: false
          VALIDATE_CHECKOV: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: false
          VALIDATE_GITLEAKS: false
          VALIDATE_HTML_PRETTIER: false
          VALIDATE_JSON_PRETTIER: false
          VALIDATE_MARKDOWN_PRETTIER: false
          VALIDATE_SHELL_SHFMT: false
          VALIDATE_XML: false
          VALIDATE_YAML_PRETTIER: false
            # checkov:skip=CKV2_GHA_1:Ensure top-level permissions are not set to write-all is irrelevant to lint only job
