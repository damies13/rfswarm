<!DOCTYPE html>
<html lang="en">
	<head>

		<!-- <script src="js/i18next.min.js"></script> -->
		<script src="https://unpkg.com/i18next/i18next.min.js"></script>

		<!-- <script src="js/i18nextHttpBackend.min.js"></script> -->
		<script src="https://unpkg.com/i18next-http-backend/i18nextHttpBackend.min.js"></script>

		<!-- <script src="js/i18nextBrowserLanguageDetector.min.js"></script> -->
		<script src="https://unpkg.com/i18next-browser-languagedetector/i18nextBrowserLanguageDetector.min.js"></script>


		<link rel="stylesheet" href="css/style.css">
		<link rel="stylesheet" href="css/icons.css">

		<!-- <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.3/themes/base/jquery-ui.css"> -->
		<!-- <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.3/themes/vader/jquery-ui.css"> -->

		<link id="jquery-ui-theme" rel="stylesheet" href="https://code.jquery.com/ui/1.13.3/themes/base/jquery-ui.css">

		<!-- <link rel="stylesheet" href="/resources/demos/style.css"> -->
		<script src="https://code.jquery.com/jquery-3.7.1.js"></script>
		<script src="https://code.jquery.com/ui/1.13.3/jquery-ui.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/jquery-i18next/jquery-i18next.min.js"></script>


		<script src="js/rfs-index.js"></script>

		<script src="js/apply-i18n.js"></script>

		<title> RFSwarm v2.0.0a0 - Untitled </title>

		<!-- Load Components -->
		<script>
			$( function() {
				$( "#tabs" ).tabs();
			} );

			function loadMyUiPanels() {
				// Menubar
				$("#menubar-pannel").load("menu.html", function() { $(this).localize(); });

				// Toolbar
				$("#toolbar-pannel").load("toolbar.html", function() { $(this).localize(); });

				// tab-plan
				$("#tab-plan").load("plan.html", function() { $(this).localize(); });
				// tab-monitoring
				$("#tab-monitor").load("monitor.html", function() { $(this).localize(); });
				// tab-run
				$("#tab-run").load("run.html", function() { $(this).localize(); });
				// tab-agents
				$("#tab-agents").load("agents.html", function() { $(this).localize(); });
				// tab-about
				$("#tab-about").load("about.html", function() { $(this).localize(); });

				$('body').localize();
			}

			if (typeof i18next !== 'undefined' && i18next.isInitialized) {
				// If it's already completely initialized right now, launch panels immediately
				loadMyUiPanels();
			} else {
				// If it's waiting on hyphenated network waterfalls, tap into the native library event
				i18next.on('initialized', function(options) {
					loadMyUiPanels();
				});
			}

		</script>


	</head>
	<body>

		<div id="menubar-pannel"></div>

		<div id="toolbar-pannel"></div>

		<!-- Language Selector Dropdown -->
		<div id="lang-switcher-menu">
			<select id="lang-switcher">
				<option value="ar" data-i18n="language.ar">Arabic</option>
				<option value="bg" data-i18n="language.bg">Bulgarian</option>
				<option value="bs" data-i18n="language.bs">Bosnian</option>
				<option value="cs" data-i18n="language.cs">Czech</option>
				<option value="de" data-i18n="language.de">German</option>
				<option value="es-ES" data-i18n="language.es">Spanish (Español)</option>
				<option value="en" data-i18n="language.en">English</option>
				<option value="fi" data-i18n="language.fi">Finnish</option>
				<option value="fr" data-i18n="language.fr">French</option>
				<option value="hi" data-i18n="language.hi">Hindi</option>
				<option value="it" data-i18n="language.it">Italian</option>
				<option value="ja" data-i18n="language.ja">Japanese</option>
				<option value="ko" data-i18n="language.ko">Korean</option>
				<option value="nl" data-i18n="language.nl">Dutch</option>
				<option value="pl" data-i18n="language.pl">Polish</option>
				<option value="pt" data-i18n="language.pt">Portugese</option>
				<option value="pt-BR" data-i18n="language.pt-BR">Brazilian Portugese</option>
				<option value="ro" data-i18n="language.ro">Romanian</option>
				<option value="ru" data-i18n="language.ru">Russian</option>
				<option value="sv" data-i18n="language.sv">Swedish</option>
				<option value="th" data-i18n="language.th">Thai</option>
				<option value="tr" data-i18n="language.tr">Turkish</option>
				<option value="uk-UA" data-i18n="language.uk-UA">Ukrainian</option>
				<option value="vi" data-i18n="language.vi">Vietnamese</option>
				<option value="zh-CH" data-i18n="language.zh-CH">Chinese Simplified</option>
				<option value="zh-TW" data-i18n="language.zh-TW">Chinese Tradional</option>
			</select>
		</div>

		<div id="tabs-pannel">
			<div id="tabs">
				<ul>
					<li><a href="#tab-plan" class="rfsm-tab" data-i18n="tabs.plan.plan">Translate Me</a></li>
					<li><a href="#tab-monitor" class="rfsm-tab" data-i18n="tabs.monitor.monitor">Translate Me</a></li>
					<li><a href="#tab-run" class="rfsm-tab" data-i18n="tabs.run.run">Translate Me</a></li>
					<li><a href="#tab-agents" class="rfsm-tab" data-i18n="tabs.agents.agents">Translate Me</a></li>
					<li><a href="#tab-about" class="rfsm-tab" data-i18n="tabs.about.about">Translate Me</a></li>
				</ul>
				<div id="tab-plan"></div>
				<div id="tab-monitor"></div>
				<div id="tab-run"></div>
				<div id="tab-agents"></div>
				<div id="tab-about"></div>
			</div>
		</div>

	</body>
</html>
