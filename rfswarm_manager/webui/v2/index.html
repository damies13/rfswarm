		<script>
			// Helper function to scan the DOM and apply translations
			function updateContent() {
				document.querySelectorAll('[data-i18n]').forEach(element => {
					const key = element.getAttribute('data-i18n');
					element.textContent = i18next.t(key);
				});
				document.documentElement.lang = i18next.language;
			}

			// Initialize i18next with Fetch Backend and Language Detector
			i18next
				.use(i18nextHttpBackend)             // Fetches JSON files over HTTP
				.use(i18nextBrowserLanguageDetector) // Auto-detects browser language & handles localStorage
				.init({
					fallbackLng: 'en',               // Fallback language if detected language is missing
					debug: true,                     // Check browser console logs to see what language was matched
					detection: {
						// Check order: 1st check user choice in localStorage, 2nd check browser system settings
						order: ['localStorage', 'navigator'],
						// Save the user's manual selection automatically into localStorage
						caches: ['localStorage'],
						lookupLocalStorage: 'preferred-lang'
					},
					backend: {
						// Relative path from your root server directory to your translation assets
						loadPath: '/locales/{{lng}}/{{ns}}.json' 
					}
				}, function(err, t) {
					if (err) return console.error(err);
					
					updateContent();
					
					// Truncate region codes if necessary (e.g., changes 'en-US' to 'en' to match dropdown)
					const currentLang = i18next.language.substring(0, 2);
					document.getElementById('lang-switcher').value = currentLang;
				});

			// Handle manual language switches
			document.getElementById('lang-switcher').addEventListener('change', (e) => {
				const selectedLang = e.target.value;
				
				i18next.changeLanguage(selectedLang, (err, t) => {
					if (err) return console.error(err);
					updateContent();
				});
			});
		</script>
