		<!-- Load Components -->
		<script>
			function loadMyUiPanels() {
				// Menubar
				$("#menubar-pannel").load("menu.html", function() { $(this).localize(); });

				// Toolbar
				$("#toolbar-pannel").load("toolbar.html", function() { $(this).localize(); });

				// tab-plan
				$("#tab-plan").load("plan.html", function() { $(this).localize(); });
				// tab-monitoring
				$("#tab-monitor").load("monitor.html", function() { $(this).localize(); });
				// tab-run
				$("#tab-run").load("run.html", function() { $(this).localize(); });
				// tab-agents
				$("#tab-agents").load("agents.html", function() { $(this).localize(); });
				// tab-about
				$("#tab-about").load("about.html", function() { $(this).localize(); });

				$('body').localize();
			}

			if (typeof i18next !== 'undefined' && i18next.isInitialized) {
				// If it's already completely initialized right now, launch panels immediately
				loadMyUiPanels();
			} else {
				// If it's waiting on hyphenated network waterfalls, tap into the native library event
				i18next.on('initialized', function(options) {
					loadMyUiPanels();
				});
			}

		</script>
