
<html >
	<head>

		<link rel="stylesheet" href="css/dialogue-scenariosettings.css">

		<script src="js/rfs-dialogue-scenariosettings.js" ></script>

	 </head>
	 <body >

		<div id="dialogue-scenariosettings" data-i18n="[title]dialogues.scenariosettings.name" title="Scenario Settings">

			<div id="scenariosettings-tabs">
				<ul>
					<li><a href="#scenariosettings-tab-scenario" class="rfsm-tab" ><span  data-i18n="dialogues.scenariosettings.tabs.scenario.name">Translate Me</a></li>
					<li><a href="#scenariosettings-tab-testdefaults" class="rfsm-tab" ><span  data-i18n="dialogues.scenariosettings.tabs.testdefaults.name">Translate Me</a></li>
					<li><a href="#scenariosettings-tab-manager" class="rfsm-tab" ><span  data-i18n="dialogues.scenariosettings.tabs.manager.name">Translate Me</a></li>
					<li><a href="#scenariosettings-tab-localbrowser" class="rfsm-tab" ><span  data-i18n="dialogues.scenariosettings.tabs.localbrowser.name">Translate Me</a></li>
				</ul>
				<div id="scenariosettings-tab-scenario">
					<div class="divtable">
						<div class="divrow">
							<span data-i18n="dialogues.scenariosettings.tabs.scenario.uploadlogs">upload logs</span>
							<span>
								<select id="upload-logs">
									<option disabled="" hidden="true"></option>
									<option value="imidiate"  data-i18n="dialogues.scenariosettings.tabs.scenario.logsopt.imidiate">imidiate</option>
									<option value="error"  data-i18n="dialogues.scenariosettings.tabs.scenario.logsopt.error">error</option>
									<option value="deferred"  data-i18n="dialogues.scenariosettings.tabs.scenario.logsopt.deferred">deferred</option>
								</select>
							</span>
						</div>
						<div class="divrow">
							<span data-i18n="dialogues.scenariosettings.tabs.scenario.unique">unique</span>
							<span>
								<div id="unique-controlgroup" class="controlgroup">
									<label for="unique-index"  data-i18n="dialogues.scenariosettings.tabs.scenario.index">index</label>
									<input type="checkbox" name="unique-index" id="unique-index">
									<label for="unique-itern"  data-i18n="dialogues.scenariosettings.tabs.scenario.itern">itern</label>
									<input type="checkbox" name="unique-itern" id="unique-itern">
									<label for="unique-sqnce"  data-i18n="dialogues.scenariosettings.tabs.scenario.sqnce">sqnce</label>
									<input type="checkbox" name="unique-sqnce" id="unique-sqnce">
								</div>
							</span>
						</div>
						<div class="divrow">
							<span data-i18n="dialogues.scenariosettings.tabs.scenario.percentile">percentile</span>
							<span>
								<input id="percentile" size="3" name="percentile" value="90">
							</span>
						</div>
					</div>
				</div>
				<div id="scenariosettings-tab-testdefaults">
					<table>
						<tr>
							<td data-i18n="dialogues.scenariosettings.tabs.testdefaults.namemode">namemode</td>
							<td colspan="3">

								<select id="namemodeopt">
									<option disabled="" hidden="true"></option>
									<option value="default"  data-i18n="dialogues.scenariosettings.tabs.testdefaults.namemodeopt.default">default</option>
									<option value="doc"  data-i18n="dialogues.scenariosettings.tabs.testdefaults.namemodeopt.doc">doc</option>
									<option value="info"  data-i18n="dialogues.scenariosettings.tabs.testdefaults.namemodeopt.info">info</option>
									<option value="keyword"  data-i18n="dialogues.scenariosettings.tabs.testdefaults.namemodeopt.keyword">keyword</option>
									<option value="keyarg"  data-i18n="dialogues.scenariosettings.tabs.testdefaults.namemodeopt.keyarg">keyarg</option>
								</select>

							</td>
						</tr>

						<tr>
							<td data-i18n="dialogues.scenariosettings.tabs.testdefaults.exclude">exclude</td>
							<td colspan="3">
								<input type="text" id="exclude" class="wide textinput" placeholder="e.g. BuiltIn,String, OperatingSystem,perftest"  value="BuiltIn,String, OperatingSystem,perftest"/>
							</td>
						</tr>

						<tr>
							<td data-i18n="dialogues.scenariosettings.tabs.testdefaults.options">options</td>
							<td colspan="3">
								<input type="text" id="exclude" class="wide textinput" placeholder="e.g. --variable EXAMPLE:value"  value=""/>
							</td>
						</tr>

						<tr>
							<td data-i18n="dialogues.scenariosettings.tabs.testdefaults.inctsttime">inctsttime</td>
							<td colspan="3">
								<label for="inctsttime"></label>
								<input type="checkbox" class="showcheck" name="inctsttime" id="inctsttime">
							</td>
						</tr>

						<tr>
							<td data-i18n="dialogues.scenariosettings.tabs.testdefaults.repeater">repeater</td>
							<td colspan="3">
								<label for="repeater"></label>
								<input type="checkbox" class="showcheck" name="repeater" id="repeater">
							</td>
						</tr>

						<tr>
							<td data-i18n="dialogues.scenariosettings.tabs.testdefaults.injsleep">injsleep</td>
							<td data-i18n="dialogues.scenariosettings.tabs.testdefaults.injsleepen">injsleepen</td>
							<td data-i18n="dialogues.scenariosettings.tabs.testdefaults.injsleepmin">injsleepmin</td>
							<td data-i18n="dialogues.scenariosettings.tabs.testdefaults.injsleepmax">injsleepmax</td>
						</tr>
						<tr>
							<td></td>
							<td>
								<label for="injsleepen"></label>
								<input type="checkbox" class="showcheck" name="injsleepen" id="injsleepen">
							</td>
							<td>
								<input type="text" id="injsleepmin" size="5" class="textinput" title="Seconds" placeholder="e.g. 15"  value="15"/>
							</td>
							<td>
								<input type="text" id="injsleepmax" size="5" class="textinput" title="Seconds" placeholder="e.g. 45"  value="45"/>
							</td>
						</tr>

						<tr>
							<td data-i18n="dialogues.scenariosettings.tabs.testdefaults.excsleep">excsleep</td>
							<!-- <td data-i18n="dialogues.scenariosettings.tabs.testdefaults.excsleepdis">excsleepdis</td>
							<td data-i18n="dialogues.scenariosettings.tabs.testdefaults.excsleepinj">excsleepinj</td>
							<td data-i18n="dialogues.scenariosettings.tabs.testdefaults.excsleepall">excsleepall</td> -->
							<td colspan="3">
								<div id="excsleep-controlgroup" class="controlgroup">
									<label for="excsleepdis" data-i18n="dialogues.scenariosettings.tabs.testdefaults.excsleepdis">excsleepdis</label>
									<input type="radio" name="excsleep" id="excsleepdis" checked>
									<label for="excsleepinj" data-i18n="dialogues.scenariosettings.tabs.testdefaults.excsleepinj">excsleepinj</label>
									<input type="radio" name="excsleep" id="excsleepinj">
									<label for="excsleepall" data-i18n="dialogues.scenariosettings.tabs.testdefaults.excsleepall">excsleepall</label>
									<input type="radio" name="excsleep" id="excsleepall">
								</div>
							</td>
						</tr>
						<!-- <tr>
							<td></td>
						</tr> -->

						<tr>
							<td data-i18n="dialogues.scenariosettings.tabs.testdefaults.pacing">pacing</td>
							<td data-i18n="dialogues.scenariosettings.tabs.testdefaults.pacingtime">pacingtime</td>
							<!-- <td data-i18n="dialogues.scenariosettings.tabs.testdefaults.pacingstart">pacingstart</td>
							<td data-i18n="dialogues.scenariosettings.tabs.testdefaults.pacingend">pacingend</td> -->
						</tr>
						<tr>
							<td></td>
							<td>
								<input type="text" id="pacingtime" size="5" class="textinput" title="Seconds" placeholder="e.g. 15"  value="0"/>
							</td>
							<td colspan="2">
								<div id="pacing-controlgroup" class="controlgroup">
									<label for="pacingstart" data-i18n="dialogues.scenariosettings.tabs.testdefaults.pacingstart">pacingstart</label>
									<input type="radio" name="pacing" id="pacingstart" checked>
									<label for="pacingend" data-i18n="dialogues.scenariosettings.tabs.testdefaults.pacingend">pacingend</label>
									<input type="radio" name="pacing" id="pacingend">
								</div>
							</td>
						</tr>

						<tr>
							<td data-i18n="dialogues.scenariosettings.tabs.testdefaults.dislogs">dislogs</td>
							<td colspan="3">
								<div id="dislogs-controlgroup" class="controlgroup">
									<label for="dislogslog"  data-i18n="dialogues.scenariosettings.tabs.testdefaults.dislogslog">dislogslog</label>
									<input type="checkbox" name="dislogslog" id="dislogslog">
									<label for="dislogsrep"  data-i18n="dialogues.scenariosettings.tabs.testdefaults.dislogsrep">dislogsrep</label>
									<input type="checkbox" name="dislogsrep" id="dislogsrep">
									<label for="dislogsxml"  data-i18n="dialogues.scenariosettings.tabs.testdefaults.dislogsxml">dislogsxml</label>
									<input type="checkbox" name="dislogsxml" id="dislogsxml">
								</div>
							</td>
						</tr>

					</table>
				</div>
				<div id="scenariosettings-tab-manager">
					<div class="divtable">
						<div class="divrow">
							<span data-i18n="dialogues.scenariosettings.tabs.manager.bindip">bindip</span>
							<span>
								<input type="text" id="bindip" class="wide textinput" placeholder="e.g., 192.168.1.1 or 2001:db8::1" class="textinput ui-widget ui-widget-content ui-corner-all" />
								<span id="bindip-status"></span>
							</span>
						</div>
						<div class="divrow">
							<span data-i18n="dialogues.scenariosettings.tabs.manager.bindport">bindport</span>
							<span>
								<input type="text" id="bindport" size="5" placeholder="e.g., 8138"  value="8138"/>
							</span>
						</div>
						<div class="divrow">
							<span data-i18n="dialogues.scenariosettings.tabs.manager.resultsloc">resultsloc</span>
							<span>
								<div class="input-fileselector">
									<input type="text" id="resultsloc"  class="ui-widget-content ui-corner-left" value="/path/to/results" disabled/>
									<button type="button" class="ui-button ui-widget ui-corner-right" id="resultsloc-browse">...</button>
								</div>
							</span>
						</div>
					</div>
				</div>
				<div id="scenariosettings-tab-localbrowser">
					<table>
						<tr>
							<td data-i18n="dialogues.scenariosettings.tabs.localbrowser.thememode"></td>
							<td>
								<select id="theme-switcher">
									<option disabled="" hidden="true"></option>
									<option value="tbar-auto" >🌓 <span data-i18n="dialogues.scenariosettings.tabs.localbrowser.themeauto">Auto</span></option>
									<option value="tbar-light" >☀️ <span data-i18n="dialogues.scenariosettings.tabs.localbrowser.themelight">Light</span></option>
									<option value="tbar-dark" >🌙 <span data-i18n="dialogues.scenariosettings.tabs.localbrowser.themedark">Dark</span></option>
								</select>
							</td>
						</tr>
						<tr>
							<td data-i18n="dialogues.scenariosettings.tabs.localbrowser.language"></td>
							<td>
								<!-- Language Selector Dropdown -->
								<select id="lang-switcher">
									<option disabled="" hidden="true"></option>
									<option value="ar" ><span data-i18n="language.ar">Arabic</span> (<span data-i18n="native-names:ar"></span>)</option>
									<option value="bg" ><span  data-i18n="language.bg">Bulgarian</span> (<span data-i18n="native-names:bg"></span>)</option>
									<option value="bs" ><span  data-i18n="language.bs">Bosnian</span> (<span data-i18n="native-names:bs"></span>)</option>
									<option value="cs" ><span  data-i18n="language.cs">Czech</span> (<span data-i18n="native-names:cs"></span>)</option>
									<option value="de" ><span  data-i18n="language.de">German</span> (<span data-i18n="native-names:de"></span>)</option>
									<option value="es-ES" ><span  data-i18n="language.es">Spanish</span> (<span data-i18n="native-names:es"></span>)</option>
									<option value="en" ><span  data-i18n="language.en">English</span> (<span data-i18n="native-names:en"></span>)</option>
									<option value="fi" ><span  data-i18n="language.fi">Finnish</span> (<span data-i18n="native-names:fi"></span>)</option>
									<option value="fr" ><span  data-i18n="language.fr">French</span> (<span data-i18n="native-names:fr"></span>)</option>
									<option value="hi" ><span  data-i18n="language.hi">Hindi</span> (<span data-i18n="native-names:hi"></span>)</option>
									<option value="it" ><span  data-i18n="language.it">Italian</span> (<span data-i18n="native-names:it"></span>)</option>
									<option value="ja" ><span  data-i18n="language.ja">Japanese</span> (<span data-i18n="native-names:ja"></span>)</option>
									<option value="ko" ><span  data-i18n="language.ko">Korean</span> (<span data-i18n="native-names:ko"></span>)</option>
									<option value="nl" ><span  data-i18n="language.nl">Dutch</span> (<span data-i18n="native-names:nl"></span>)</option>
									<option value="pl" ><span  data-i18n="language.pl">Polish</span> (<span data-i18n="native-names:pl"></span>)</option>
									<option value="pt" ><span  data-i18n="language.pt">Portugese</span> (<span data-i18n="native-names:pt"></span>)</option>
									<option value="pt-BR" ><span  data-i18n="language.pt-BR">Brazilian Portugese</span> (<span data-i18n="native-names:pt-BR"></span>)</option>
									<option value="ro" ><span  data-i18n="language.ro">Romanian</span> (<span data-i18n="native-names:ro"></span>)</option>
									<option value="ru" ><span  data-i18n="language.ru">Russian</span> (<span data-i18n="native-names:ru"></span>)</option>
									<option value="sv" ><span  data-i18n="language.sv">Swedish</span> (<span data-i18n="native-names:sv"></span>)</option>
									<option value="th" ><span  data-i18n="language.th">Thai</span> (<span data-i18n="native-names:th"></span>)</option>
									<option value="tr" ><span  data-i18n="language.tr">Turkish</span> (<span data-i18n="native-names:tr"></span>)</option>
									<option value="uk-UA" ><span  data-i18n="language.uk-UA">Ukrainian</span> (<span data-i18n="native-names:uk-UA"></span>)</option>
									<option value="vi" ><span  data-i18n="language.vi">Vietnamese</span> (<span data-i18n="native-names:vi"></span>)</option>
									<option value="zh-CH" ><span  data-i18n="language.zh-CH">Chinese Simplified</span> (<span data-i18n="native-names:zh-CH"></span>)</option>
									<option value="zh-TW" ><span  data-i18n="language.zh-TW">Chinese Tradional</span> (<span data-i18n="native-names:zh-TW"></span>)</option>
								</select>
							</td>
						</tr>
					
					</table>
				</div>
			</div>

			<div class="dialog-buttons" >
				<button type="button" id="btn-scenariosettings-ok" data-i18n="dialogues.scenariosettings.ok">OK</button>
				<button type="button" id="btn-scenariosettings-cancel" data-i18n="dialogues.scenariosettings.cancel">Cancel</button>
			</div>

		</div>

 	</body>
 </html>
